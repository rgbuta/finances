<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login|Finances Management App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff0f6,#f3e8ff);padding:20px}
.card{background:white;border-radius:24px;padding:32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(236,72,153,.15);border:1px solid #f9a8d4;text-align:center}
.logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#ec4899,#8b7cf8);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px}
h1{color:#be185d;font-size:22px;font-weight:800} .sub{color:#9ca3af;font-size:13px;margin-bottom:24px}
.input-group{margin-bottom:14px;text-align:left} label{font-size:11px;font-weight:700;color:#6d28d9;margin-bottom:6px;display:block}
input{width:100%;padding:14px 16px;border:2px solid #f3e8ff;border-radius:12px;font-size:14px;outline:none;background:#fdf4ff}
input:focus{border-color:#ec4899;background:white}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#ec4899,#8b7cf8);color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}
.error{background:#fff1f2;color:#e11d48;padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card">
<div class="logo">💖</div>
<h1>Finances Management App</h1>
<p class="sub">Finance Dashboard - Secure Login</p>
<div id="errorBox" class="ehrror"></div>
<div class="input-group"><label>USERNAME</label><input id="username" type="text" placeholder="Enter username"></div>
<div class="input-group"><label>PASSWORD</label><input id="password" type="password" placeholder="Enter password"></div>
<button class="btn" onclick="doLogin()">🔐 LOGIN</button>
<p style="margin-top:16px;font-size:11px;color:#a78bfa">Protected by Boss Christine 🔥</p>
</div>
<script>
const ALLOWED_USER = "boss";
const ALLOWED_PASS = "christine2026";
function doLogin(){
  let u=document.getElementById('username').value.trim();
  let p=document.getElementById('password').value.trim();
  let err=document.getElementById('errorBox');
  if(u===ALLOWED_USER && p===ALLOWED_PASS){
    sessionStorage.setItem('boss_auth','true');
    sessionStorage.setItem('boss_login_time',Date.now());
    localStorage.setItem('boss_auth_persist','true');
    window.location.href="index.html";
  }else{
    err.style.display="block";
    err.textContent="❌ Wrong username or password boss!";
    setTimeout(()=>err.style.display="none",3000);
  }
}
document.addEventListener('keydown',(e)=>{if(e.key==='Enter')doLogin();});
if(sessionStorage.getItem('boss_auth')==='true'){
  window.location.href="index.html";
}
</script>
</body>
</html>
